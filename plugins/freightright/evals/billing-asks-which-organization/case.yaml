schema_version: "1.1"
name: billing-asks-which-organization
tags: [tier-a, billing, critical]
expected_outcome: "Two billable organizations and no default, so the assistant asks which to bill rather than choosing."
execution:
  prompt: "Get me a price for two 40HC containers from Shanghai to Los Angeles, shipping early October."
  max_turns: 8
  timeout_seconds: 180
  allowed_tools: [Skill]
graders:
  - name: skill-fired
    type: "tool_used"
    tool: "Skill"
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?instant-pricing"'
    arm: "with-only"
  - name: did-not-price-before-the-choice
    type: "tool_used"
    tool: "mcp__plugin_freightright_freightright__freightright_get_instant_rates"
    min: 0
    max: 0
    arm: "both"
  - name: asks-first
    type: "llm"
    criteria: |
      Two organizations are billable and neither is the default, so the customer has to choose. Judge the reply
      text only; whether a price check was actually run is asserted separately.
      PASS if the reply asks the customer which organization to bill, naming Acme Imports LLC and Bright Co Ltd
      as the choice.
      FAIL if it announces which organization it is billing rather than asking, claims one is the default, or
      presents freight prices.
