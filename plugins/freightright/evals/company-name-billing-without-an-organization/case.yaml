schema_version: "1.1"
name: company-name-billing-without-an-organization
tags: [tier-a, billing]
expected_outcome: "An account with no billable organization (policy COMPANY_NAME) is priced under the company name the customer gives, and is never asked to choose an organization."
execution:
  prompt: "Price two 40HC containers from Shanghai to Los Angeles, shipping early October. The company is Solo Trading."
  max_turns: 10
  timeout_seconds: 180
  allowed_tools: [Skill]
graders:
  - name: skill-fired
    type: "tool_used"
    tool: "Skill"
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:instant-pricing|connection-and-billing)"'
    arm: "with-only"
  - name: priced-under-the-company-name
    type: "tool_used"
    tool: "mcp__plugin_freightright_freightright__freightright_get_instant_rates"
    input_match: '"billing_company_name"\s*:\s*"Solo Trading"'
    min: 1
    arm: "with-only"
  - name: never-an-organization-id
    type: "tool_used"
    tool: "mcp__plugin_freightright_freightright__freightright_get_instant_rates"
    input_match: 'billing_organization_id'
    min: 0
    max: 0
    arm: "both"
  - name: does-not-ask-for-an-organization
    type: "llm"
    criteria: |
      The account bills by company name: there is no organization to choose. Judge the reply text only.
      PASS if the reply presents the instant prices for Solo Trading, or says the price check is still running.
      FAIL if it asks the customer which organization to bill, says an organization is required, or refuses
      because the account has no organizations.
