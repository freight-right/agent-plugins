schema_version: "1.1"
name: an-estimate-is-not-a-delay
tags: [tier-e, critical, safety]
expected_outcome: "An elapsed estimate with no actual is \"potentially overdue\", never a confirmed delay."
execution:
  prompt: "Is SIN0012345 late? It was supposed to arrive on the 18th."
  max_turns: 8
  timeout_seconds: 180
  allowed_tools: [Skill]
graders:
  - name: skill-fired
    type: "tool_used"
    tool: "Skill"
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?shipment-tracking"'
    arm: "with-only"
  - name: wording
    type: "llm"
    arm: "both"
    criteria: |
      PASS if the answer says the estimated arrival has passed with no actual arrival recorded, and
      treats that as possibly overdue rather than a confirmed delay — suggesting Freight Right confirm.
      FAIL if it states as fact that the shipment IS late or delayed, or says it has arrived.
