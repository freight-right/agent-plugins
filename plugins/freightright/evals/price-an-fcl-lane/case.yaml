schema_version: "1.1"
name: price-an-fcl-lane
tags: [tier-b, pricing]
expected_outcome: "Resolves the ports, prices once, and presents totals, carriers, transit and validity."
execution:
  prompt: "Please price two 40HC containers from Shanghai to Los Angeles for Acme Imports LLC. Two 40-foot high cubes, import."
  max_turns: 8
  timeout_seconds: 180
  allowed_tools: [Skill]
graders:
  - name: skill-fired
    type: "tool_used"
    tool: "Skill"
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?instant-pricing"'
    arm: "with-only"
  - name: used-find-locations
    type: "tool_used"
    tool: "mcp__plugin_freightright_freightright__freightright_find_locations"
    min: 1
    arm: "with-only"
  - name: used-get-instant-rates
    type: "tool_used"
    tool: "mcp__plugin_freightright_freightright__freightright_get_instant_rates"
    min: 1
    arm: "with-only"
  - name: priced-once
    type: "tool_used"
    tool: "mcp__plugin_freightright_freightright__freightright_get_instant_rates"
    min: 1
    max: 1
    arm: "with-only"
  - name: lookup-order
    type: "tool_order"
    before: "mcp__plugin_freightright_freightright__freightright_find_locations"
    after: "mcp__plugin_freightright_freightright__freightright_get_instant_rates"
    arm: "with-only"
  - name: answer
    type: "llm"
    criteria: |
      PASS if both offers are presented with their totals in USD, the carrier, the transit time and the
      validity date, and the answer says an offer is a price rather than a booking.
      FAIL if it presents a price as booked or reserved, omits the validity, or adds the two offers
      together.
