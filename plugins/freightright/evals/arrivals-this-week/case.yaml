schema_version: "1.1"
name: arrivals-this-week
tags: [tier-b, tracking, pagination, critical]
expected_outcome: "Pages with the cursor the server returned, carrying the same filters, and reports both shipments."
execution:
  prompt: "List every shipment due to arrive on or before 2026-09-27 that has no actual arrival recorded yet. I want all of them, not just the first page."
  max_turns: 10
  timeout_seconds: 240
  allowed_tools: [Skill]
graders:
  - name: skill-fired
    type: "tool_used"
    tool: "Skill"
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?shipment-tracking"'
    arm: "with-only"
  - name: fetched-both-pages
    type: "tool_used"
    tool: "mcp__plugin_freightright_freightright__freightright_list_shipments"
    min: 2
    arm: "both"
  - name: first-page-carries-the-filters
    type: "tool_used"
    tool: "mcp__plugin_freightright_freightright__freightright_list_shipments"
    input_match: '(?=.*"arriving_to"\s*:\s*"2026-09-27")(?=.*"arrival_recorded"\s*:\s*false)'
    min: 1
    arm: "both"
  - name: second-page-keeps-them-and-uses-the-returned-cursor
    type: "tool_used"
    tool: "mcp__plugin_freightright_freightright__freightright_list_shipments"
    input_match: '(?=.*"cursor"\s*:\s*"eyJvIjoxfQ")(?=.*"arriving_to"\s*:\s*"2026-09-27")(?=.*"arrival_recorded"\s*:\s*false)'
    min: 1
    arm: "both"
  - name: answer-has-both-shipments
    type: "llm"
    arm: "both"
    criteria: |
      PASS if the answer reports BOTH SIN0012345 and SIN0012399, and does not claim further pages remain.
      FAIL if it reports only the first page, invents a shipment, or says more pages are available.
