schema_version: "1.1"
name: arrivals-this-week
tags: [tier-b, tracking]
expected_outcome: "Lists arrivals and offers the next page using the cursor the server returned."
execution:
  prompt: "What should be arriving at Los Angeles this week that has not landed yet?"
  max_turns: 8
  timeout_seconds: 180
  allowed_tools: [Skill]
graders:
  - name: skill-fired
    type: "tool_used"
    tool: "Skill"
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?shipment-tracking"'
    arm: "with-only"
  - name: used-list-shipments
    type: "tool_used"
    tool: "mcp__plugin_freightright_freightright__freightright_list_shipments"
    min: 1
    arm: "with-only"
  - name: cursor
    type: "regex"
    target: "last_message"
    pattern: "eyJvIjoxfQ|more"
    flags: "i"
    arm: "with-only"
